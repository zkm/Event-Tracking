name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Verify tracking.js parses
        run: node --check tracking.js

      - name: Lint
        run: yarn lint

      - name: Prettier check
        run: yarn format:check
